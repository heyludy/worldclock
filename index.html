<style>
  :root {
    --bg: #000;
    --tile: #1c1c1e;
    --tile-2: #2c2c2e;
    --sep: rgba(255,255,255,.10);
    --label: #fff;
    --label-2: rgba(235,235,245,.60);
    --label-3: rgba(235,235,245,.32);
    --orange: #ff9f0a;
    --good: #30d158;
    --r-lg: 18px;
    --r-md: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                 "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    font-size: 16px;
    line-height: 1.45;
    letter-spacing: -.01em;
    padding: clamp(18px, 3.5vw, 34px) clamp(14px, 3vw, 28px) 48px;
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 980px; }

  /* ---------------- header ---------------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding: 0 2px;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 4.6vw, 26px);
    font-weight: 700;
    letter-spacing: -.028em;
  }

  .seg {
    margin-left: auto;
    flex: none;
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--tile-2);
    border-radius: 9px;
  }

  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--label-2);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    padding: 4px 13px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }

  .seg button[aria-pressed="true"] {
    background: #636366;
    color: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  /* ---------------- map ---------------- */
  .map {
    position: relative;
    background: #050505;
    border-radius: var(--r-lg);
    overflow: hidden;
  }

  .map svg { display: block; width: 100%; height: auto; }

  .pin {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    white-space: nowrap;
  }

  .pin i {
    display: block;
    width: 9px; height: 9px;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,159,10,.22);
  }

  .pin b {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    display: block;
    font-size: clamp(11px, 1.6vw, 13px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.25;
    text-shadow: 0 0 2px #000, 0 0 4px rgba(0,0,0,.95), 0 0 9px rgba(0,0,0,.85), 0 1px 2px #000;
  }

  .pin b span {
    display: block;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,.92);
  }

  .pin.left b { left: auto; right: 15px; text-align: right; }

  /* ---------------- city tiles ---------------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.4vw, 12px);
    margin-top: clamp(8px, 1.4vw, 12px);
  }

  .tile {
    background: var(--tile);
    border-radius: var(--r-md);
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .face { width: clamp(78px, 12vw, 104px); height: auto; flex: none; }
  .face circle, .face g, .face line { transition: fill .35s ease, stroke .35s ease; }

  .info { min-width: 0; }

  .name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.015em;
  }

  .clock {
    margin-top: 1px;
    font-size: clamp(22px, 3.4vw, 27px);
    font-weight: 300;
    letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }

  .clock small {
    font-size: .46em;
    font-weight: 500;
    letter-spacing: -.01em;
    margin-left: 3px;
    color: var(--label-2);
  }

  .rel {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--label-2);
    font-variant-numeric: tabular-nums;
  }

  .sun {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---------------- slider ---------------- */
  .panel {
    margin-top: clamp(8px, 1.4vw, 12px);
    background: var(--tile);
    border-radius: var(--r-md);
    padding: 16px 18px 16px;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
  }

  .panel-title {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -.015em;
  }

  .shift {
    font-size: 13px;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
  }

  .reset {
    margin-left: auto;
    appearance: none;
    border: 0;
    background: var(--tile-2);
    color: var(--label-2);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .15s, background .15s;
  }

  .reset:hover { background: #3a3a3c; color: #fff; }
  .reset[hidden] { display: none; }

  .status {
    display: flex;
    align-items: center;
    flex-wrap: wrap;          /* "Philadelphia and Zurich are asleep" is long */
    gap: 2px 7px;
    font-size: 12.5px;
    color: var(--label-2);
    margin-bottom: 4px;
  }

  .status i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    flex: none;
    transition: background .25s ease;
  }

  .status.off i { background: #5a5a5e; }

  .status em {
    margin-left: auto;
    font-style: normal;
    font-size: 11.5px;
    color: var(--label-3);
    white-space: nowrap;
  }

  input[type=range] {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: 100%;
    height: 28px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  /* the track is painted by script: green where all three cities are awake */
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 3px;
    background: var(--track, #3a3a3c);
  }

  input[type=range]::-moz-range-track {
    height: 5px;
    border-radius: 3px;
    background: var(--track, #3a3a3c);
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    margin-top: -8.5px;
    border-radius: 50%;
    background: #fff;
    border: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,.6), 0 0 0 .5px rgba(0,0,0,.2);
  }

  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }

  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255,159,10,.35); }
  input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(255,159,10,.35); }

  .ticks {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
    padding: 0 1px;
  }

  footer {
    margin-top: 16px;
    padding: 0 4px;
    font-size: 11.5px;
    color: var(--label-3);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  footer a { color: var(--label-3); }

  /* ---------------- narrow ---------------- */
  @media (max-width: 640px) {
    .pin i { width: 7px; height: 7px; }
    .pin b { font-size: 10.5px; left: 12px; }
    .pin b span { display: none; }
    .pin.phl b { left: auto; right: 12px; text-align: right; }
    .tiles { grid-template-columns: 1fr; gap: 1px; background: var(--sep); border-radius: var(--r-md); overflow: hidden; }
    .tile {
      flex-direction: row;
      align-items: center;
      text-align: left;
      gap: 14px;
      border-radius: 0;
      padding: 12px 15px;
    }
    .face { width: 58px; }
    .info { flex: 1; }
    .name { font-size: 13px; color: var(--label-2); font-weight: 500; }
    .clock { font-size: 25px; }
    .rel { font-size: 12px; margin-top: 1px; }
    .sun { font-size: 11px; }
  }
</style>
</head>

    var lon = ra - gmst * 15;
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    return { lat: decl / RAD, lon: lon, decl: decl };
  }

  // How far above the horizon the sun is, in degrees. Negative means it has set.
  function altitude(lat, lon, sun) {
    var phi = lat * RAD;
    return Math.asin(Math.sin(phi) * Math.sin(sun.decl) +
                     Math.cos(phi) * Math.cos(sun.decl) * Math.cos((lon - sun.lon) * RAD)) / RAD;
  }

  // Latitude of the day/night line at a given longitude.
  function terminatorLat(lon, sun) {
    var t = Math.tan(sun.decl);
    if (Math.abs(t) < 1e-6) t = t < 0 ? -1e-6 : 1e-6;   // equinox: line runs pole to pole
    return Math.atan(-Math.cos((lon - sun.lon) * RAD) / t) / RAD;
  }

  function drawNight(sun) {
    var pts = [];
    for (var lon = -180; lon <= 180; lon += 2) {
      pts.push(projX(lon).toFixed(1) + " " + projY(terminatorLat(lon, sun)).toFixed(1));
    }
    var line = "M" + pts.join("L");
    // Sun north of the equator -> the north pole is lit, so night lies to the south.
    var poleY = sun.lat >= 0 ? projY(-90) : projY(90);
    nightPath.setAttribute("d", line + "L" + projX(180) + " " + poleY + "L" + projX(-180) + " " + poleY + "Z");
    termPath.setAttribute("d", line);
  }

  // ---------- sunrise / sunset ----------
  // Minutes-from-midnight UTC is awkward across date lines, so work in absolute instants.
  function sunEvents(date, city, sun) {
    // Solar noon: the moment the subsolar longitude sweeps past the city.
    var deltaDeg = ((sun.lon - city.lon + 540) % 360) - 180;    // degrees still to travel
    var noon = new Date(date.getTime() + (deltaDeg / 15) * 3600000);
    var s2 = subsolar(noon);
    var phi = city.lat * RAD;
    var cosH = (Math.cos(90.833 * RAD) - Math.sin(phi) * Math.sin(s2.decl)) /
               (Math.cos(phi) * Math.cos(s2.decl));
    if (cosH > 1) return null;              // polar night
    if (cosH < -1) return { midnightSun: true };
    var half = (Math.acos(cosH) / RAD / 15) * 3600000;
    return { rise: new Date(noon.getTime() - half), set: new Date(noon.getTime() + half) };
  }

  // ---------- build pins + tiles ----------
  var ui = {};
  CITIES.forEach(function (c) {
    var pin = document.createElement("div");
    pin.className = "pin " + c.key + (c.side === "left" ? " left" : "");
    pin.style.left = ((c.lon + 180) / 360 * 100) + "%";
    // the svg viewBox is cropped, so map latitude into the visible window
    pin.style.top = ((projY(c.lat) - VB_Y) / VB_H * 100) + "%";
    pin.innerHTML = '<i></i><b>' + c.name + '<span data-pt></span></b>';
    map.appendChild(pin);

    var tile = document.createElement("article");
    tile.className = "tile";
    tile.innerHTML =
      '<svg class="face" viewBox="-50 -50 100 100" aria-hidden="true">' +
        '<circle data-dial cx="0" cy="0" r="47.3" fill="#fff" stroke="transparent" stroke-width="1.3"/>' +
        '<g data-nums fill="#000" font-size="12" font-weight="600" ' +
           'text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"></g>' +
        '<line data-hh x1="0" y1="7" x2="0" y2="-25" stroke="#000" stroke-width="4.6" stroke-linecap="round"/>' +
        '<line data-mm x1="0" y1="9" x2="0" y2="-36" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>' +
        '<line data-ss x1="0" y1="11" x2="0" y2="-38" stroke="#ff9f0a" stroke-width="1.3" stroke-linecap="round"/>' +
        '<circle data-hub cx="0" cy="0" r="2.6" fill="#000"/>' +
        '<circle data-pip cx="0" cy="0" r="1.1" fill="#fff"/>' +
      '</svg>' +
      '<div class="info">' +
        '<div class="name">' + c.name + '</div>' +
        '<div class="clock"><span data-t></span><small data-ap></small></div>' +
        '<div class="rel" data-rel></div>' +
        '<div class="sun" data-sun></div>' +
      '</div>';

    var nums = tile.querySelector("[data-nums]");
    for (var i = 1; i <= 12; i++) {
      var a = i * 30 * RAD;
      var t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", (Math.sin(a) * 37).toFixed(2));
      t.setAttribute("y", (-Math.cos(a) * 37 + 4.3).toFixed(2));
      t.textContent = i;
      nums.appendChild(t);
    }
    tiles.appendChild(tile);

    ui[c.key] = {
      pinTime: pin.querySelector("[data-pt]"),
      dial: tile.querySelector("[data-dial]"),
      nums: nums,
      hub: tile.querySelector("[data-hub]"),
      pip: tile.querySelector("[data-pip]"),
      hh: tile.querySelector("[data-hh]"),
      mm: tile.querySelector("[data-mm]"),
      ss: tile.querySelector("[data-ss]"),
      time: tile.querySelector("[data-t]"),
      ampm: tile.querySelector("[data-ap]"),
      rel: tile.querySelector("[data-rel]"),
      sun: tile.querySelector("[data-sun]")
    };
  });

  // ---------- "everyone is awake" band ----------
  // Walk the whole slider range once and paint the track green wherever all three
  // cities sit inside AWAKE. Only depends on the ten-minute baseline, so it is
  // rebuilt every ten minutes rather than every tick.
  var band = { key: null };

  function awakeAt(date, city) {
    var p = partsIn(date, city.tz);
    var h = p.hour + p.minute / 60;
    return h >= AWAKE.from && h < AWAKE.to;
  }

  var GOOD = "#30d158";

  function buildBand(baseMs) {
    var STEP = 10, N = 2880 / STEP, ok = new Array(N + 1), i, j;
    for (i = 0; i <= N; i++) {
      var t = new Date(baseMs + (-1440 + i * STEP) * 60000);
      ok[i] = true;
      for (j = 0; j < CITIES.length; j++) {
        if (!awakeAt(t, CITIES[j])) { ok[i] = false; break; }
      }
    }
    var stops = [], cur = ok[0], start = 0;
    for (i = 1; i <= N + 1; i++) {
      if (i > N || ok[i] !== cur) {
        stops.push((cur ? GOOD : "#3a3a3c") + " " +
                   (start / N * 100).toFixed(3) + "% " +
                   (Math.min(i, N) / N * 100).toFixed(3) + "%");
        if (i > N) break;
        cur = ok[i]; start = i;
      }
    }
    slider.style.setProperty("--track", "linear-gradient(90deg," + stops.join(",") + ")");
    return { key: baseMs };
  }

  function hourLabel(h) {
    if (h === 0) return "12 AM";
    if (h === 12) return "12 PM";
    return use24 ? pad(h) + ":00" : (h % 12) + (h < 12 ? " AM" : " PM");
  }

  // ---------- render ----------
  function render() {
    var shiftMin = +slider.value;
    var now = new Date();
    // At rest we show the real time. Once the slider moves we snap to the nearest
    // ten-minute mark first, so every projected time reads x:00, x:10, x:20...
    var TEN = 10 * 60000;
    var target = shiftMin === 0
      ? now
      : new Date(Math.round(now.getTime() / TEN) * TEN + shiftMin * 60000);
    var sun = subsolar(target);
    drawNight(sun);

    var baseMs = Math.round(now.getTime() / TEN) * TEN;
    if (band.key !== baseMs) band = buildBand(baseMs);

    // Everything is described relative to the viewer's own device, the way the Clock app does it.
    var localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var localOff = offsetMinutes(target, localTz);
    var todayStamp = dayStamp(partsIn(now, localTz));

    var asleep = [];

    CITIES.forEach(function (c) {
      var p = partsIn(target, c.tz);
      var n = ui[c.key];
      var hourNow = p.hour + p.minute / 60;
      if (hourNow < AWAKE.from || hourNow >= AWAKE.to) asleep.push(c.name);

      var t = clockText(p.hour, p.minute);
      n.time.textContent = t.main;
      n.ampm.textContent = t.suffix;
      n.pinTime.textContent = shortTime(p.hour, p.minute);

      // the dial goes dark wherever the sun has set, like the Clock app
      var isNight = altitude(c.lat, c.lon, sun) <= -0.833;
      var ink = isNight ? "#fff" : "#000";
      n.dial.setAttribute("fill", isNight ? "#0c0c0e" : "#fff");
      n.dial.setAttribute("stroke", isNight ? "rgba(255,255,255,.3)" : "transparent");
      n.nums.setAttribute("fill", ink);
      n.hh.setAttribute("stroke", ink);
      n.mm.setAttribute("stroke", ink);
      n.hub.setAttribute("fill", ink);
      n.pip.setAttribute("fill", isNight ? "#0c0c0e" : "#fff");

      // analog hands
      var secFrac = p.second;
      n.hh.setAttribute("transform", "rotate(" + ((p.hour % 12) * 30 + p.minute * 0.5 + secFrac * 0.00833) + ")");
      n.mm.setAttribute("transform", "rotate(" + (p.minute * 6 + secFrac * 0.1) + ")");
      n.ss.setAttribute("transform", "rotate(" + (secFrac * 6) + ")");

      // "Today, +9 HRS"
      var diffDays = Math.round((dayStamp(p) - todayStamp) / 86400000);
      var dayWord = diffDays === 0 ? "Today"
                  : diffDays === -1 ? "Yesterday"
                  : diffDays === 1 ? "Tomorrow"
                  : MONTHS[p.month - 1] + " " + p.day;
      var dh = (offsetMinutes(target, c.tz) - localOff) / 60;
      var hrs = (dh > 0 ? "+" : dh < 0 ? "−" : "+") + (Math.abs(dh) % 1 ? Math.abs(dh).toFixed(1) : Math.abs(dh));
      n.rel.textContent = dayWord + ", " + hrs + " HRS";

      var ev = sunEvents(target, c, sun);
      if (!ev) {
        n.sun.textContent = "Polar night";
      } else if (ev.midnightSun) {
        n.sun.textContent = "Midnight sun";
      } else {
        var r = partsIn(ev.rise, c.tz), s = partsIn(ev.set, c.tz);
        n.sun.textContent = "↑ " + shortTime(r.hour, r.minute) + "   ↓ " + shortTime(s.hour, s.minute);
      }
    });

    statusEl.classList.toggle("off", asleep.length > 0);
    statusMsg.textContent = asleep.length === 0
      ? "All three awake"
      : (asleep.length === 1 ? asleep[0] + " is asleep"
                             : asleep.slice(0, -1).join(", ") + " and " +
                               asleep[asleep.length - 1] + " are asleep");
    document.getElementById("awakeNote").textContent =
      "awake = " + hourLabel(AWAKE.from) + "–" + hourLabel(AWAKE.to) + " local";

    if (shiftMin === 0) {
      shiftLabel.textContent = "Now";
      resetBtn.hidden = true;
    } else {
      var a = Math.abs(shiftMin), h = Math.floor(a / 60), m = a % 60;
      shiftLabel.textContent = (shiftMin < 0 ? "−" : "+") +
        (h ? h + " hr" : "") + (h && m ? " " : "") + (m ? m + " min" : "");
      resetBtn.hidden = false;
    }
  }

  // ---------- events ----------
  slider.addEventListener("input", render);

  resetBtn.addEventListener("click", function () {
    slider.value = 0;
    render();
  });

  function syncSeg() {
    segButtons.forEach(function (b) {
      b.setAttribute("aria-pressed", String((b.dataset.fmt === "24") === use24));
    });
  }

  segButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      use24 = btn.dataset.fmt === "24";
      syncSeg();
      try { localStorage.setItem("wc-format", use24 ? "24" : "12"); } catch (e) { /* noop */ }
      render();
    });
  });
  syncSeg();

  try {
    document.getElementById("device").textContent =
      "This device: " + Intl.DateTimeFormat().resolvedOptions().timeZone;
  } catch (e) { /* noop */ }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
